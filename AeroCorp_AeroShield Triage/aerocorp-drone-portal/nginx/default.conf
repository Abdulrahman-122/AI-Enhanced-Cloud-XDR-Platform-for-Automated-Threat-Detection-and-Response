# NGINX in front of the portal. Plain reverse proxy for now; the WAF (ModSecurity + OWASP CRS)
# is added in the security phase, after the attacks are running.
#
# HTTPS is NOT handled here. Cloudflare Tunnel (cloudflared) terminates TLS at Cloudflare's edge and
# forwards plain HTTP to this server. Do not publish port 8080 to the internet directly.

# The visitor's real IP: Cloudflare's header when present, otherwise the connection address.
map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    etag off;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    # Room for a 2 MB aircraft photo upload (the backend enforces the exact limit).
    client_max_body_size 3m;

    # Access log in the standard combined format: this is what Wazuh will read later.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # Overwrite any X-Real-IP a client sends. The backend trusts this header for rate limits and logs.
    # Behind Cloudflare Tunnel the connection always comes from the tunnel, so use the visitor's IP
    # that Cloudflare passes in CF-Connecting-IP (otherwise every attacker looks like one address to Wazuh).
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $real_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API and the honeytoken files served by the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 30s;
    }

    location = /.env              { proxy_pass http://backend:8000; }
    location /backup/             { proxy_pass http://backend:8000; }

    # Uploaded drone photos, served from the backend's media folder.
    location /api/media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Built React assets have hashed names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path returns index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
