apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: wazuh
  namespace: xdr-server
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: wazuh-root
    spec:
      storage:
        storageClassName: csi-hostpath-sc
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: 20Gi          # must be >= the golden image PVC (xdr-volume, 5Gi); Wazuh packages need room
      source:
        pvc:                       # clone the golden Ubuntu image
          name: xdr-volume
          namespace: xdr-server
  - metadata:
      name: wazuh-data
    spec:
      storage:
        storageClassName: csi-hostpath-sc
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: 20Gi          # Wazuh indexer data grows; 3Gi fills up fast
      source:
        blank: {}
  template:
    metadata:
      labels:
        app: wazuh
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        resources:
          requests:
            cpu: "1"
            memory: 4500Mi         # guest 4Gi + ~400Mi QEMU overhead
          limits:
            cpu: "2"
            memory: 4500Mi
        devices:
          disks:
          - name: rootdisk
            disk: {bus: virtio}
          - name: datadisk
            serial: appdata01
            disk: {bus: virtio}
          - name: cloudinit
            disk: {bus: virtio}
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        dataVolume: {name: wazuh-root}
      - name: datadisk
        dataVolume: {name: wazuh-data}
      - name: cloudinit
        cloudInitNoCloud:
          networkData: |
            version: 2
            ethernets:
              all-en:
                match:
                  name: "en*"
                dhcp4: true
          userData: |
            #cloud-config
            hostname: wazuh
            user: adam
            password: adam
            chpasswd: {expire: false}
            ssh_pwauth: true
            packages:
              - qemu-guest-agent
            runcmd:
              - systemctl enable --now qemu-guest-agent
              - blkid /dev/disk/by-id/virtio-appdata01 || mkfs.ext4 -L appdata /dev/disk/by-id/virtio-appdata01
              - mkdir -p /data
              - echo 'LABEL=appdata /data ext4 defaults,nofail 0 2' >> /etc/fstab
              - mount -a
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-ssh
  namespace: xdr-server
spec:
  type: NodePort
  selector:
    app: wazuh
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30022
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh
  namespace: xdr-server
spec:
  selector:
    app: wazuh
  ports:
  - {name: events, port: 1514, targetPort: 1514}
  - {name: enroll, port: 1515, targetPort: 1515}
  - {name: api, port: 55000, targetPort: 55000}
  - {name: dashboard, port: 443, targetPort: 443}
